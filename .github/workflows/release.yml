name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee release_build_output.txt

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="app/build/outputs/apk/debug/app-debug.apk#jobsearch-${TAG}-debug.apk"
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" --title "Jobsearch ${TAG}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "Jobsearch ${TAG}" --notes "Debug sideload build. See README for details."
          fi